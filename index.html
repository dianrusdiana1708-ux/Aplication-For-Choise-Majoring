<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Siapa Mau Jadi Akuntan?</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:800px;
background:white;
border-radius:25px;
padding:40px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
text-align:center;
}

h1{
color:#1565c0;
margin-bottom:15px;
}

p{
color:#666;
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#1565c0;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
}

#game{
display:none;
}

#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

.score{
background:#eef4ff;
padding:10px;
border-radius:10px;
margin-bottom:20px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div id="menu">

<h1>🎮 SIAPA MAU JADI AKUNTAN?</h1>

<p>
Uji pengetahuan akuntansimu dan raih skor tertinggi.
</p>

<button onclick="startGame()">
▶ MULAI GAME
</button>

</div>

<div id="game">

<div class="score">
Skor : <span id="score">0</span>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<div id="result"></div>

</div>

</div>

<script>

const quiz = [

{
q:"Persamaan dasar akuntansi adalah?",
a:["Aset = Liabilitas + Ekuitas","Pendapatan = Beban","Kas = Modal","Laba = Pendapatan"],
correct:0
},

{
q:"Pajak Penghasilan disingkat?",
a:["PPN","PBB","PPh","BPHTB"],
correct:2
},

{
q:"Audit bertujuan untuk?",
a:["Membuat laporan","Menilai kewajaran laporan","Menjual produk","Membayar pajak"],
correct:1
},

{
q:"Akun Kas termasuk?",
a:["Aset","Liabilitas","Beban","Modal"],
correct:0
}

];

let current=0;
let score=0;

function startGame(){

document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";

showQuestion();

}

function showQuestion(){

let q=quiz[current];

document.getElementById("question").innerHTML=q.q;

let html="";

q.a.forEach((ans,index)=>{

html+=`
<button onclick="checkAnswer(${index})">
${ans}
</button>
`;

});

document.getElementById("answers").innerHTML=html;

}

function checkAnswer(index){

if(index===quiz[current].correct){

score+=10;

document.getElementById("result").innerHTML=
"✅ Jawaban Benar";

}else{

document.getElementById("result").innerHTML=
"❌ Jawaban Salah";

}

document.getElementById("score").innerHTML=score;

setTimeout(()=>{

current++;

if(current<quiz.length){

document.getElementById("result").innerHTML="";
showQuestion();

}else{

finishGame();

}

},1000);

}

function finishGame(){

document.getElementById("game").innerHTML=`

<h1>🏆 GAME SELESAI</h1>

<h2>Skor Akhir : ${score}</h2>

<p>
Good Job Future Accountant 🚀
</p>

<button onclick="location.reload()">
Main Lagi
</button>

`;

}

</script>

</body>
</html>
