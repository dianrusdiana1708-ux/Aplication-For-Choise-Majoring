<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auditor Runner</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

#menu{
text-align:center;
color:white;
}

#menu h1{
font-size:48px;
margin-bottom:20px;
}

#menu p{
margin-bottom:25px;
}

button{
padding:15px 30px;
border:none;
border-radius:12px;
background:#f59e0b;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

#gameContainer{
display:none;
position:relative;
}

canvas{
background:#dbeafe;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,.3);
}

#score{
position:absolute;
top:10px;
left:10px;
background:white;
padding:10px 15px;
border-radius:10px;
font-weight:bold;
}

#gameOver{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:30px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.controls{
margin-top:15px;
display:flex;
gap:10px;
justify-content:center;
}

.ctrl{
width:80px;
height:60px;
font-size:30px;
}
</style>
</head>

<body>
<audio id="bgMusic" loop>
    <source src="dl.mp3" type="audio/mpeg">
</audio>
<div id="menu">
<h1>🏃 AUDITOR RUNNER</h1>
<p>Hindari fraud dan kumpulkan laporan keuangan!</p>

<button onclick="startGame()">▶ MULAI GAME</button>
</div>

<div id="gameContainer">

<div id="score">
Skor: <span id="scoreValue">0</span>
</div>

<canvas id="game" width="400" height="700"></canvas>

<div id="gameOver">
<h2>💥 GAME OVER</h2>
<br>
<p>Skor: <span id="finalScore"></span></p>
<br>
<button onclick="location.reload()">Main Lagi</button>
</div>

<div class="controls">
<button class="ctrl" onclick="moveLeft()">⬅️</button>
<button class="ctrl" onclick="moveRight()">➡️</button>
</div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let running = false;

let score = 0;

const lanes = [80,200,320];

let player = {
lane:1,
x:200,
y:600,
w:50,
h:70
};

let obstacles = [];
let coins = [];
const mobilImg = new Image();
mobilImg.src = "MOBIL MBG";
function startGame(){
document.getElementById("bgMusic").play();
document.getElementById("menu").style.display="none";
document.getElementById("gameContainer").style.display="block";

running = true;

setInterval(spawnObstacle,1200);
setInterval(spawnCoin,1500);

requestAnimationFrame(loop);

}

function spawnObstacle(){

if(!running) return;

obstacles.push({
x:lanes[Math.floor(Math.random()*3)]-25,
y:-80,
w:50,
h:70
});

}

function spawnCoin(){

if(!running) return;

coins.push({
x:lanes[Math.floor(Math.random()*3)],
y:-30,
r:15
});

}

function moveLeft(){

if(player.lane>0){
player.lane--;
player.x=lanes[player.lane];
}

}

function moveRight(){

if(player.lane<2){
player.lane++;
player.x=lanes[player.lane];
}

}

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowLeft") moveLeft();

if(e.key==="ArrowRight") moveRight();

});

function drawRoad(){

ctx.fillStyle="#555";
ctx.fillRect(40,0,320,700);

ctx.strokeStyle="white";
ctx.lineWidth=5;

ctx.setLineDash([20,20]);

ctx.beginPath();
ctx.moveTo(140,0);
ctx.lineTo(140,700);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(260,0);
ctx.lineTo(260,700);
ctx.stroke();

ctx.setLineDash([]);

}

function drawPlayer(){

ctx.drawImage(
mobilImg,
player.x - 40,
player.y,
80,
80
);

}

function drawObstacles(){

ctx.fillStyle="red";

obstacles.forEach(o=>{

o.y += 6;

ctx.fillRect(o.x,o.y,o.w,o.h);

});

}

function drawCoins(){

ctx.fillStyle="gold";

coins.forEach(c=>{

c.y += 5;

ctx.beginPath();
ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
ctx.fill();

});

}

function collision(a,b){

return(
a.x-a.w/2 < b.x+b.w &&
a.x+a.w/2 > b.x &&
a.y < b.y+b.h &&
a.y+a.h > b.y
);

}

function loop(){

if(!running) return;

ctx.clearRect(0,0,400,700);

drawRoad();

drawPlayer();

drawObstacles();

drawCoins();

obstacles.forEach((o,index)=>{

if(collision(player,o)){

gameOver();

}

if(o.y>750){

obstacles.splice(index,1);

score++;

}

});

coins.forEach((c,index)=>{

let dx = player.x-c.x;

let dy = (player.y+35)-c.y;

let dist = Math.sqrt(dx*dx+dy*dy);

if(dist<35){

score+=5;

coins.splice(index,1);

}

});

document.getElementById("scoreValue").innerText=score;

requestAnimationFrame(loop);

}

function gameOver(){

running=false;

document.getElementById("finalScore").innerText=score;

document.getElementById("gameOver").style.display="block";

}

</script>

</body>
</html>
